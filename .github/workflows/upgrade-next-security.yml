name: Upgrade Next security release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/website-v2-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Next.js Active LTS security release
        run: npm install --save-exact next@16.3.8 eslint-config-next@16.3.8
      - name: Apply non-breaking production audit fixes
        run: npm audit fix --omit=dev --audit-level=high
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run product:verify-source
      - run: npm run product:check
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:export
      - name: Commit verified security upgrade and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/upgrade-next-security.yml
          git diff --cached --quiet && exit 1
          git commit -m "Upgrade Next.js to 16.3.8 security release"
          git push origin HEAD:feat/website-v2-redesign
