name: Refresh approved Website 3 visual baselines

on:
  push:
    branches: [feat/website-v2-redesign]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/website-v2-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Regenerate visual baselines
        shell: bash
        run: |
          PORT=5001 node scripts/serve-static.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npx playwright test --grep "visual coverage for key pages" --update-snapshots
      - name: Commit only approved baseline changes
        shell: bash
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          approved='^(tests/browser/snapshots/linux/(desktop/-compare-.png|mobile/-integrations-.png|laptop-1366/-compare-.png|laptop-1440/-compare-.png|desktop-1920/-compare-.png|desktop/-(changelog|legal|solutions)-.png|mobile/-(changelog|legal|solutions)-.png)|\.github/workflows/refresh-website3-baselines.yml)$'
          unexpected="$(git -C "$GITHUB_WORKSPACE" status --short | awk '{print $2}' | grep -Ev "$approved" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected visual changes:"
            echo "$unexpected"
            exit 1
          fi

          git -C "$GITHUB_WORKSPACE" add \
            tests/browser/snapshots/linux/desktop/-compare-.png \
            tests/browser/snapshots/linux/mobile/-integrations-.png \
            tests/browser/snapshots/linux/laptop-1366/-compare-.png \
            tests/browser/snapshots/linux/laptop-1440/-compare-.png \
            tests/browser/snapshots/linux/desktop-1920/-compare-.png \
            tests/browser/snapshots/linux/desktop/-changelog-.png \
            tests/browser/snapshots/linux/desktop/-legal-.png \
            tests/browser/snapshots/linux/desktop/-solutions-.png \
            tests/browser/snapshots/linux/mobile/-changelog-.png \
            tests/browser/snapshots/linux/mobile/-legal-.png \
            tests/browser/snapshots/linux/mobile/-solutions-.png
          git -C "$GITHUB_WORKSPACE" rm .github/workflows/refresh-website3-baselines.yml
          git -C "$GITHUB_WORKSPACE" diff --cached --quiet && { echo "No approved baseline changes found"; exit 1; }
          git -C "$GITHUB_WORKSPACE" commit -m "Refresh approved Website 3 visual baselines"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:feat/website-v2-redesign
