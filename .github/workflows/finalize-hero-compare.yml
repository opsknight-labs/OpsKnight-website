name: Finalize composed hero and comparison visuals

on:
  push:
    branches: [feat/website-v2-redesign]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: feat/website-v2-redesign
          fetch-depth: 0
          path: site
      - name: Checkout OpsKnight v2.0.0 artwork
        uses: actions/checkout@v4
        with:
          repository: opsknight-labs/OpsKnight
          ref: v2.0.0
          path: source
      - name: Import composed v2 hero
        shell: bash
        run: |
          test -s source/public/readme/hero.webp
          cp source/public/readme/hero.webp site/public/product/hero-composite.webp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and refresh approved visual baselines
        working-directory: site
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run product:check
          npm run build
          PORT=5001 node scripts/serve-static.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npx playwright test --grep "visual coverage for key pages" --update-snapshots
      - name: Commit composed artwork and approved baselines
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/site"
          git -C "$GITHUB_WORKSPACE/site" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE/site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE/site" add public/product/hero-composite.webp
          git -C "$GITHUB_WORKSPACE/site" add tests/browser/snapshots/linux/*/home.png
          git -C "$GITHUB_WORKSPACE/site" add tests/browser/snapshots/linux/*/-compare-.png
          git -C "$GITHUB_WORKSPACE/site" rm .github/workflows/finalize-hero-compare.yml
          git -C "$GITHUB_WORKSPACE/site" commit -m "Use composed v2 hero and refresh comparison visuals"
          git -C "$GITHUB_WORKSPACE/site" push origin HEAD:feat/website-v2-redesign
