name: Generate visual baseline candidates

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-static-candidates
          path: out/

  candidates:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-static-candidates
          path: out/
      - name: Generate candidate baselines
        shell: bash
        run: |
          PORT=5001 node scripts/serve-static.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          export PREVIEW_URL=http://127.0.0.1:5001
          npx playwright test --grep "visual coverage for key pages" --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-candidates
          path: tests/browser/snapshots/linux/
