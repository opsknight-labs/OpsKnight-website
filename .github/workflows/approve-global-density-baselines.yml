name: Approve global density baselines

on:
  push:
    branches: [feat/website-v2-redesign]

permissions:
  contents: write

jobs:
  approve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/website-v2-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Refresh reviewed desktop density baselines
        shell: bash
        run: |
          PORT=5001 node scripts/serve-static.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npx playwright test \
            --grep "visual coverage for key pages" \
            --project=desktop \
            --project=laptop-1366 \
            --project=laptop-1440 \
            --project=desktop-1920 \
            --update-snapshots
      - name: Commit reviewed baselines and remove approval workflow
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add \
            tests/browser/snapshots/linux/desktop \
            tests/browser/snapshots/linux/laptop-1366 \
            tests/browser/snapshots/linux/laptop-1440 \
            tests/browser/snapshots/linux/desktop-1920
          git -C "$GITHUB_WORKSPACE" rm .github/workflows/approve-global-density-baselines.yml
          git -C "$GITHUB_WORKSPACE" commit -m "Approve global density visual baselines"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:feat/website-v2-redesign
