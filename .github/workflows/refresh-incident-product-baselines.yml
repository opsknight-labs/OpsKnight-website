name: Refresh incident product visual baselines

on:
  push:
    branches: [feat/website-v2-redesign]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/website-v2-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Regenerate visual baselines
        shell: bash
        run: |
          PORT=5001 node scripts/serve-static.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npx playwright test --grep "visual coverage for key pages" --update-snapshots
      - name: Commit only incident baseline changes
        shell: bash
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          unexpected=""
          for file in $(git -C "$GITHUB_WORKSPACE" status --short | awk '{print $2}'); do
            case "$file" in
              public/social/*) ;;
              .github/workflows/refresh-incident-product-baselines.yml) ;;
              tests/browser/snapshots/linux/desktop/-product-incidents-.png) ;;
              tests/browser/snapshots/linux/mobile/-product-incidents-.png) ;;
              tests/browser/snapshots/linux/laptop-1366/-product-incidents-.png) ;;
              tests/browser/snapshots/linux/laptop-1440/-product-incidents-.png) ;;
              tests/browser/snapshots/linux/desktop-1920/-product-incidents-.png) ;;
              *) unexpected="$unexpected $file" ;;
            esac
          done
          if [ -n "$unexpected" ]; then
            echo "Unexpected visual changes:$unexpected"
            exit 1
          fi

          git -C "$GITHUB_WORKSPACE" add \
            tests/browser/snapshots/linux/desktop/-product-incidents-.png \
            tests/browser/snapshots/linux/mobile/-product-incidents-.png \
            tests/browser/snapshots/linux/laptop-1366/-product-incidents-.png \
            tests/browser/snapshots/linux/laptop-1440/-product-incidents-.png \
            tests/browser/snapshots/linux/desktop-1920/-product-incidents-.png
          git -C "$GITHUB_WORKSPACE" rm .github/workflows/refresh-incident-product-baselines.yml
          git -C "$GITHUB_WORKSPACE" commit -m "Refresh incident product visual baselines"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:feat/website-v2-redesign
