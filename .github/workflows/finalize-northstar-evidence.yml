name: Finalize Northstar product evidence

on:
  push:
    branches: [feat/website-v2-redesign]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: feat/website-v2-redesign
          fetch-depth: 0
          path: site

      - name: Checkout OpsKnight v2.0.0
        uses: actions/checkout@v4
        with:
          repository: opsknight-labs/OpsKnight
          ref: v2.0.0
          path: source

      - name: Set up Node for OpsKnight
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpsKnight capture dependencies
        working-directory: source
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        working-directory: source
        run: npx playwright install --with-deps chromium

      - name: Add website evidence journey
        working-directory: source
        shell: bash
        run: |
          cat > tests/docs/journeys/website-product-capture.spec.ts <<'EOF'
          import { mkdir } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { expect, test, type Page } from '@playwright/test';
          import { DOCS_FIXTURES } from '../fixtures/constants';
          import { assertEvidenceReady } from '../helpers/evidence';

          const output = resolve('generated/website-captures');

          async function capture(page: Page, name: string) {
            await assertEvidenceReady(page);
            await page.waitForTimeout(700);
            await page.screenshot({
              path: resolve(output, `${name}.png`),
              animations: 'disabled',
              caret: 'hide',
              fullPage: false,
            });
          }

          test.beforeAll(async () => {
            await mkdir(output, { recursive: true });
          });

          test('captures one Northstar product universe', async ({ page }) => {
            await page.goto('/');
            await expect(page.getByText('Command Center', { exact: true }).first()).toBeVisible();
            await capture(page, 'dashboard-overview');

            await page.goto('/incidents');
            await expect(page.getByText(DOCS_FIXTURES.incident, { exact: true }).first()).toBeVisible();
            await page.getByText(DOCS_FIXTURES.incident, { exact: true }).first().click();
            await expect(page).toHaveURL(/\/incidents\/[^/]+$/);
            await capture(page, 'incident-detail');

            await page.goto('/schedules');
            await expect(page.getByText(DOCS_FIXTURES.schedule, { exact: true }).first()).toBeVisible();
            await page.getByText(DOCS_FIXTURES.schedule, { exact: true }).first().click();
            await expect(page).toHaveURL(/\/schedules\/[^/]+$/);
            await capture(page, 'on-call-schedule-detail');

            await page.goto('/settings/notifications');
            await expect(page.locator('#main-content')).toBeVisible();
            await capture(page, 'notification-settings');

            await page.goto('/analytics');
            await expect(page.getByText('Analytics & Insights', { exact: true })).toBeVisible();
            await capture(page, 'analytics-overview');

            await page.goto('/postmortems');
            await expect(page.locator('#main-content')).toBeVisible();
            await capture(page, 'postmortems');

            await page.goto('/audit');
            await expect(page.locator('#main-content')).toBeVisible();
            await capture(page, 'audit-log');

            await page.goto('/settings/system/health');
            await expect(page.getByText('System Health Center', { exact: true }).first()).toBeVisible();
            await capture(page, 'health-center');

            await page.goto('/settings/status-pages');
            await expect(page.getByText(DOCS_FIXTURES.statusPage, { exact: true }).first()).toBeVisible();
            await capture(page, 'status-pages');
          });
          EOF

      - name: Capture v2.0.0 Northstar evidence
        working-directory: source
        env:
          CI: "true"
          DOCS_OPSKNIGHT_IMAGE: ghcr.io/opsknight-labs/opsknight@sha256:099023cbd024fac4c53435aaf2bff669f0e8bf04ba96564d3a3d62d6bdfe0d62
          DOCS_IMAGE_PULL_POLICY: always
        run: npx playwright test -c playwright.docs.config.ts tests/docs/journeys/website-product-capture.spec.ts --project=docs-chromium

      - name: Set up Node for website
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Import captures and provenance
        working-directory: site
        shell: bash
        run: |
          cat > .northstar-import.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";
          import sharp from "sharp";

          const source = path.resolve("../source/generated/website-captures");
          const manifestPath = "content/product/screenshots.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const capturedAt = new Date().toISOString();
          const map = {
            "dashboard-overview": { route: "/" },
            "incident-detail": { route: "/incidents/[northstar-incident]" },
            "on-call-schedule-detail": { route: "/schedules/[commerce-primary-on-call]" },
            "notification-settings": { route: "/settings/notifications" },
            "analytics-overview": { route: "/analytics" },
            "postmortems": { route: "/postmortems" },
            "audit-log": { route: "/audit" },
            "health-center": { route: "/settings/system/health" },
            "status-pages": {
              route: "/settings/status-pages",
              authenticated: true,
              publicProof: "https://status.opsknight.com"
            }
          };

          manifest.source = "OpsKnight v2.0.0 documentation evidence runtime";
          manifest.capturedAt = capturedAt;
          manifest.runtimeImage = "ghcr.io/opsknight-labs/opsknight@sha256:099023cbd024fac4c53435aaf2bff669f0e8bf04ba96564d3a3d62d6bdfe0d62";
          manifest.runtimeRevision = "097f4916a38ddcc6d1512f71b72bde36abbeb171";
          manifest.capturePipeline = "OpsKnight v2.0.0 docs evidence journey";
          manifest.fixture = "Northstar Systems";
          manifest.assets ??= {};

          for (const stale of [
            "incident-triggered",
            "incident-acknowledged",
            "teams-chatops-war-room",
            "mobile"
          ]) {
            delete manifest.assets[stale];
          }

          for (const [name, extra] of Object.entries(map)) {
            const input = path.join(source, `${name}.png`);
            if (!fs.existsSync(input)) throw new Error(`missing capture: ${input}`);
            const output = `public/product/${name}.webp`;
            await sharp(input).webp({ quality: 88 }).toFile(output);
            const meta = await sharp(input).metadata();
            const bytes = fs.readFileSync(output);
            const sha256 = crypto.createHash("sha256").update(bytes).digest("hex");
            manifest.assets[name] = {
              width: meta.width,
              height: meta.height,
              sha256,
              fixture: "Northstar Systems",
              ...extra,
            };
            for (const width of [400, 800, 1200].filter((w) => w < meta.width)) {
              await sharp(output)
                .resize({ width })
                .webp({ quality: 82 })
                .toFile(`public/product/${name}-${width}.webp`);
            }
          }

          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          EOF
          rm -f public/product/incident-triggered*.webp
          rm -f public/product/incident-acknowledged*.webp
          rm -f public/product/teams-chatops-war-room*.webp
          rm -f public/product/mobile*.webp
          node .northstar-import.mjs
          rm .northstar-import.mjs
          npm run product:generate

      - name: Build and refresh intentional visual baselines
        working-directory: site
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          npm run build
          PORT=5001 node scripts/serve-static.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npx playwright test --grep "visual coverage for key pages" --update-snapshots

      - name: Commit Northstar evidence and approved baselines
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/site"
          git -C "$GITHUB_WORKSPACE/site" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE/site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE/site" add -A public/product
          git -C "$GITHUB_WORKSPACE/site" add content/product/screenshots.json src/generated/product-manifest.json
          git -C "$GITHUB_WORKSPACE/site" add tests/browser/snapshots/linux/*/home.png
          git -C "$GITHUB_WORKSPACE/site" add tests/browser/snapshots/linux/*/-product-incidents-.png
          git -C "$GITHUB_WORKSPACE/site" add tests/browser/snapshots/linux/*/-deploy-.png
          git -C "$GITHUB_WORKSPACE/site" rm .github/workflows/finalize-northstar-evidence.yml
          git -C "$GITHUB_WORKSPACE/site" commit -m "Unify marketing evidence on Northstar v2 fixture"
          git -C "$GITHUB_WORKSPACE/site" push origin HEAD:feat/website-v2-redesign
